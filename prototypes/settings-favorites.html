<!doctype html>
<meta charset="utf-8" />
<title>Rizum Glass · 设置组件原型</title>
<style>
:root{font-family:"MiSans VF","Segoe UI",sans-serif;color:#18181b;background:#f0f0f0;--panel:#fffffff8;--line:#e4e4e7;--muted:#71717a;--teal:#2dd4bf;--focus:#2dd4bf38;--surface:#ffffff85;--hover:#ffffffad;--shadow:0 18px 44px #0000001f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 12%,#fff 0 8%,transparent 32%),#f0f0f0}.window{width:620px;min-height:470px;padding:26px 30px;border:1px solid #ffffff6b;border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}h1{font:22px "Noto Serif SC",serif;margin:0 0 24px}.rule{height:1px;background:#e4e4e780;margin:20px 0}.label{font-size:13px;color:#71717a;margin-bottom:8px}.control{height:42px;border:1px solid var(--line);border-radius:9px;background:#ffffffb8;display:flex;align-items:center;padding:0 13px;justify-content:space-between}.chev{color:#a1a1aa;font-size:14px}.row{display:flex;gap:10px;align-items:center}.seg{display:flex;background:#18181b0a;border-radius:9px;padding:3px;gap:3px}.seg button{border:0;border-radius:7px;background:transparent;padding:9px 18px;color:#71717a;font:inherit;cursor:pointer}.seg button.active{background:#ffffffe8;color:#18181b;box-shadow:0 2px 8px #0000000f}.subtle{font-size:12px;color:#a1a1aa}.favorite{margin-top:24px;border:1px solid var(--line);border-radius:10px;background:#ffffff85;overflow:hidden}.favorite-head{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.favorite-head:hover{background:#ffffffad}.dot{width:7px;height:7px;border-radius:50%;background:#a78bfa;display:inline-block;margin-right:8px}.favorite-list{padding:0 10px 10px;display:grid;gap:5px}.fav{padding:10px 9px;border-radius:8px;display:flex;justify-content:space-between}.fav:hover{background:#f4f4f5e8}.count{color:#a1a1aa;font-size:12px}.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px #ffffff14 inset,0 8px 24px #0000003d,0 2px 6px #0000001f;font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:#ffffff1f}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#ffffff8c;font:inherit;cursor:pointer}.proto-picker-item:hover{color:#ffffffd9}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:#ffffff1f}.proto-picker-replay{padding:0 10px;font-size:14px}
</style>
<main id="stage"></main>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Quiet</button><button class="proto-picker-item">Grouped</button><button class="proto-picker-item">Drawer</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
<script>
const variants=[()=>`<section class="window"><h1>VRC Bili Relay</h1><div class="label">输出分辨率</div><div class="control"><span>720p</span><span class="chev">⌄</span></div><div class="rule"></div><div class="label">账户</div><div class="row"><strong>Rizum</strong><span class="subtle">已登录</span></div><div class="favorite"><div class="favorite-head" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span><i class="dot"></i>收藏夹</span><span class="chev">⌄</span></div><div class="favorite-list"><div class="fav"><span>默认收藏夹</span><span class="count">42 个视频</span></div><div class="fav"><span>音乐合集</span><span class="count">18 个视频</span></div></div></div></section>`,()=>`<section class="window"><h1>VRC Bili Relay</h1><div class="label">输出分辨率</div><div class="seg"><button class="active">720p</button><button>1080p</button></div><p class="subtle">1080p 源保持 1920×1080；较低分辨率按比例补边。</p><div class="rule"></div><div class="label">收藏夹</div><div class="favorite"><div class="favorite-head"><span><i class="dot"></i>已登录账户的收藏</span><span class="subtle">打开浏览</span></div><div class="favorite-list"><div class="fav"><span>默认收藏夹</span><span class="count">42</span></div><div class="fav"><span>音乐合集</span><span class="count">18</span></div></div></div></section>`,()=>`<section class="window"><h1>VRC Bili Relay</h1><div class="row" style="justify-content:space-between"><div><div class="label">输出分辨率</div><div class="control" style="width:220px"><span>1080p</span><span class="chev">⌄</span></div></div><div style="text-align:right"><div class="label">收藏夹</div><div class="control" style="width:220px"><span>默认收藏夹</span><span class="chev">⌄</span></div></div></div><div class="rule"></div><p class="subtle">选择后立即保存；推流中的视频不会因打开此设置而断开。</p></section>`];
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;function move(){let e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}function mount(i){stage.innerHTML='';requestAnimationFrame(()=>stage.innerHTML=variants[i]())}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((e,j)=>{e.toggleAttribute('data-active',j===i);j===i?e.setAttribute('aria-current','true'):e.removeAttribute('aria-current')});move();let u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i)}items.forEach((e,i)=>e.onclick=()=>setActive(i));replay.onclick=()=>mount(current);onresize=move;onkeydown=e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;let n=parseInt(e.key);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current+2)%variants.length);else if(e.key.toLowerCase()==='r')mount(current)};setActive((parseInt(new URLSearchParams(location.search).get('v'))||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
