name: Windows build

on:
  push:
    branches: [main, fix/relay-lifecycle-observability]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Record toolchain versions
        run: |
          bun --version
          rustc --version
          cargo --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      # AGENTS.md permits builds and measurements, not functional test suites.
      - name: Build and package Windows portable application
        run: bun run package:windows
      - name: Measure real worker round trips
        shell: pwsh
        run: |
          $env:VRC_BILI_RELAY_WORKER = Join-Path $PWD 'target/release/relay-worker.exe'
          $env:VRC_BILI_RELAY_DIAGNOSTICS_DIR = Join-Path $PWD 'artifacts/benchmarks/diagnostics'
          bun run benchmarks/worker-roundtrip.bench.ts
      - name: Record archive checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/package/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding utf8NoBOM
          }
      - name: Upload build artifacts (not a formal Release)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ github.sha }}
          path: |
            artifacts/package/*.zip
            artifacts/package/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-measurements-${{ github.sha }}
          path: artifacts/benchmarks
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    # A block scalar keeps the colon in the release prefix out of YAML syntax.
    # Only intentional main-branch release commits receive this job's token.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-${{ github.sha }}
          path: artifacts/release-package
      - uses: actions/download-artifact@v4
        with:
          name: worker-measurements-${{ github.sha }}
          path: artifacts/release-measurements
      - name: Publish exact verified portable archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-windows-release.ps1 -PackageDirectory artifacts/release-package -MeasurementDirectory artifacts/release-measurements
      - name: Retain release verification
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: release/RELEASE-VERIFICATION.json
          if-no-files-found: error
