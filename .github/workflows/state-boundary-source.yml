name: State boundary source
on:
  push:
    branches: [fix/session-expiry-list-state]
    paths: [.github/workflows/state-boundary-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p artifacts/source
          git archive --format=tar.gz HEAD -o artifacts/source/source.tar.gz
          git rev-parse HEAD > artifacts/source/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-boundary-source-${{ github.sha }}
          path: artifacts/source
          retention-days: 7
