name: Apply reviewed media follow-up
on:
  push:
    branches: [fix/media-timeline-danmaku]
    paths: [.github/workflows/apply-media-followup.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Rizumu85/rizum-vrc-bili-relay' && github.ref == 'refs/heads/fix/media-timeline-danmaku'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed ownership changes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          hashes = {
            'crates/relay-core/src/ffmpeg.rs': '878ae88e87de95039e6af9a44e1ce3ccaaa1565c6672e968e51dc45425972b46',
            'crates/relay-core/src/stream_diagnostics.rs': '73ee233772c63cc2256e8b5fba1f81cf92722a5f9ac42cc8c9e63c2eee17001e',
            'crates/relay-core/src/media_measurements.rs': '1f7f376de888b8b6631af7de6cdeabe4d42d07a2967df79a9e835f23fe0c9d1f',
          }
          for path, digest in hashes.items():
              if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Source changed; refusing follow-up: ' + path)
          def replace(path, old, new):
              p=pathlib.Path(path); text=p.read_text()
              if text.count(old) != 1: raise SystemExit('Ambiguous replacement: ' + path)
              p.write_text(text.replace(old,new))
          replace('crates/relay-core/src/ffmpeg.rs',
            '''    if !input.is_live {
                  // Audio is padded to video EOF; silence must never keep a VOD producer
                  // alive forever. The video stream owns the content lifetime.
                  command.args(["-shortest"]);
              }'''.replace('      ','    '), 'unused') if False else None
          path='crates/relay-core/src/ffmpeg.rs'
          old='    if !input.is_live {\n        // Audio is padded to video EOF; silence must never keep a VOD producer\n        // alive forever. The video stream owns the content lifetime.\n        command.args(["-shortest"]);\n    }'
          new='    if !input.is_live || matches!(&input.audio, MediaAudio::Silence) {\n        // Generated/padded audio has no natural EOF. It is subordinate to the\n        // real video even when an unknown-duration source is classified live.\n        command.args(["-shortest"]);\n    }'
          replace(path,old,new)
          replace('crates/relay-core/src/stream_diagnostics.rs',
            '        } else if line.contains("broken pipe")',
            '        } else if line.contains("not a runtime option") {\n            "filter_runtime_option"\n        } else if line.contains("failed to process command") {\n            "filter_command"\n        } else if line.contains("no such filter") || line.contains("error parsing") {\n            "filter_parse"\n        } else if line.contains("broken pipe")')
          replace('crates/relay-core/src/media_measurements.rs',
            '        rows.push(snapshot(&process,"natural_completion",started,Some(&state)));\n        Ok(())',
            '''        rows.push(snapshot(&process,"natural_completion",started,Some(&state)));
                  // Finite bytes standing in for a live source: its synthetic audio
                  // must not keep the process alive after the real video reaches EOF.
                  let mut live_silent = silent_source.clone();
                  live_silent.is_live = true;
                  let started = Instant::now();
                  process.switch_content(&live_silent,0.0,None,PlaybackRate::Normal).map_err(|e|e.message)?;
                  let mut outcome = "observation_deadline";
                  while started.elapsed() < Duration::from_secs(20) {
                      match process.poll(&live_silent,None).map_err(|e|e.message)? {
                          ProcessPoll::Exited { success, source_exit, .. } => {
                              outcome = if success && source_exit { "source_eof" } else { "unexpected_exit" };
                              break;
                          }
                          _ => thread::sleep(Duration::from_millis(80)),
                      }
                  }
                  rows.push(snapshot(&process,"live_video_only_eof",started,Some(outcome)));
                  Ok(())'''.replace('\n                  ','\n        '))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/relay-core/src/ffmpeg.rs crates/relay-core/src/stream_diagnostics.rs crates/relay-core/src/media_measurements.rs
          git commit -m 'fix: bound all generated audio by video EOF and classify filter errors (AI-assisted)'
          git push origin HEAD:fix/media-timeline-danmaku
