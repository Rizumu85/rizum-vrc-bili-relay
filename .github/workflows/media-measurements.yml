name: Media measurements

on:
  push:
    branches: [main, fix/media-timeline-danmaku]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-measurements-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked TypeScript dependencies
        run: bun install --frozen-lockfile
      - name: Prepare local FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          rustc --version
      - name: Build observation helper (no functional test runner)
        run: cargo build --locked --release -p relay-core --features media-measurements --example media-measurements
      - name: Build real worker for lifecycle observations
        run: cargo build --locked --release --bin relay-worker
      - name: Observe UI ownership and actual worker generation loss
        run: |
          export VRC_BILI_RELAY_WORKER="$PWD/target/release/relay-worker"
          export VRC_BILI_RELAY_DIAGNOSTICS_DIR="$PWD/artifacts/benchmarks/ui-diagnostics"
          bun run benchmarks/ui-state.bench.ts
      - name: Observe expired sessions and list request boundaries
        run: |
          export VRC_BILI_RELAY_WORKER="$PWD/target/release/relay-worker"
          export VRC_BILI_RELAY_DIAGNOSTICS_DIR="$PWD/artifacts/benchmarks/boundary-diagnostics"
          bun run benchmarks/state-boundary.bench.ts
      - name: Observe polling continuity and query-scoped search
        env:
          VRC_BILI_RELAY_DIAGNOSTICS_DIR: artifacts/benchmarks/liveness-diagnostics
        run: bun run benchmarks/liveness.bench.ts
      - name: Measure synthetic local media
        env:
          VRC_BILI_RELAY_DIAGNOSTICS_DIR: artifacts/benchmarks/media/diagnostics
        run: bun run benchmarks/media-pipeline.bench.ts
      - name: Measure ASS source-clock alignment through actual rollback
        run: bun run benchmarks/ass-clock.bench.ts
      - name: Retain numeric observations and bounded logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-media-measurements-${{ github.sha }}
          path: |
            artifacts/benchmarks/*.json
            artifacts/benchmarks/ui-diagnostics/*.jsonl
            artifacts/benchmarks/boundary-diagnostics/*.jsonl
            artifacts/benchmarks/liveness-diagnostics/*.jsonl
            artifacts/benchmarks/media/*.json
            artifacts/benchmarks/media/diagnostics/*.jsonl
            artifacts/benchmarks/ass-clock/**/diagnostics/*.jsonl
          if-no-files-found: warn
          retention-days: 14
