name: UI state repair review
on:
  push:
    branches: [fix/ui-state-ownership]
    paths: [.github/workflows/ui-state-review.yml, tools/apply-ui-state-review.py]
permissions:
  contents: read
concurrency:
  group: ui-state-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified ordered patches on the repair branch only
        id: apply
        run: python tools/apply-ui-state-review.py
  measure:
    needs: apply-reviewed-patch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-reviewed-patch.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies and check TypeScript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
      - name: Prepare Linux FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Prepare verified Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/prepare-media-measurements.ps1
      - name: Build real worker and feature-gated measurement adapter
        run: |
          cargo build --locked --release --bin relay-worker
          cargo build --locked --release -p relay-core --features media-measurements --example media-measurements
      - name: Observe UI state scheduling and real worker generation loss
        shell: bash
        env:
          REVIEW_REVISION: ${{ needs.apply-reviewed-patch.outputs.sha }}
        run: |
          export GITHUB_SHA="$REVIEW_REVISION"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export VRC_BILI_RELAY_WORKER="$PWD/target/release/relay-worker.exe"
          else
            export VRC_BILI_RELAY_WORKER="$PWD/target/release/relay-worker"
          fi
          export VRC_BILI_RELAY_DIAGNOSTICS_DIR="$PWD/artifacts/benchmarks/ui-diagnostics"
          bun run benchmarks/ui-state.bench.ts
      - name: Observe existing worker transport
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export VRC_BILI_RELAY_WORKER="$PWD/target/release/relay-worker.exe"
          else
            export VRC_BILI_RELAY_WORKER="$PWD/target/release/relay-worker"
          fi
          export VRC_BILI_RELAY_DIAGNOSTICS_DIR="$PWD/artifacts/benchmarks/worker-diagnostics"
          bun run benchmarks/worker-roundtrip.bench.ts
      - name: Observe existing media and ASS rollback
        shell: bash
        env:
          REVIEW_REVISION: ${{ needs.apply-reviewed-patch.outputs.sha }}
        run: |
          export GITHUB_SHA="$REVIEW_REVISION"
          export VRC_BILI_RELAY_DIAGNOSTICS_DIR="$PWD/artifacts/benchmarks/media/diagnostics"
          bun run benchmarks/media-pipeline.bench.ts
          bun run benchmarks/ass-clock.bench.ts
      - name: Package Windows application
        if: runner.os == 'Windows'
        run: bun run package:windows
      - name: Retain quantitative observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-state-${{ runner.os }}-${{ needs.apply-reviewed-patch.outputs.sha }}
          path: artifacts/benchmarks/
          retention-days: 30
          if-no-files-found: warn
