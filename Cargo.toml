[workspace]
members = ["crates/relay-core", "crates/relay-worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
brotli = "8.0.4"
flate2 = "1.1.9"
md-5 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["net", "rt", "time"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
zeromq = { version = "0.6.0", default-features = false, features = ["tcp-transport", "tokio-runtime"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
